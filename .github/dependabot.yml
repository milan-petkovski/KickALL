version: 2
updates:
  # Root dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Bot service dependencies
  - package-ecosystem: "npm"
    directory: "/Bot"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Website dependencies
  - package-ecosystem: "npm"
    directory: "/Website"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
