name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  test-and-lint:
    name: Run Tests, Linting & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Bot Dependencies
        working-directory: ./Bot
        run: npm ci

      - name: Install Website Dependencies
        working-directory: ./Website
        run: npm install

      - name: Install Root Dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Run Security Audit (Root & Bot)
        run: |
          npm audit --audit-level=high
          cd Bot && npm audit --audit-level=high

      - name: Verify Web Application Assets
        run: node scripts/build.js
