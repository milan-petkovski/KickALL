<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KickALL API Test</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #06040A;
            color: #53FC18;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-container {
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .pass {
            background: rgba(83, 252, 24, 0.2);
            border: 1px solid #53FC18;
        }
        .fail {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #EF4444;
        }
        button {
            background: #8B5CF6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 0;
        }
        button:hover {
            background: #6D28D9;
        }
        pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
        .summary {
            font-size: 18px;
            font-weight: bold;
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>🧪 KickALL API Test Suite</h1>
    
    <div class="test-container">
        <h2>API Connectivity Tests</h2>
        <p>This will test various API endpoints to verify CORS handling and connectivity.</p>
        <button onclick="runTests()">▶️ Run Tests</button>
        <button onclick="clearResults()">🗑️ Clear Results</button>
    </div>
    
    <div id="results"></div>
    
    <script src="js/config.js"></script>
    <script src="js/api-test.js"></script>
    
    <script>
        function runTests() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>⏳ Running tests...</p>';
            
            // Re-run the test
            const script = document.createElement('script');
            script.src = 'js/api-test.js?t=' + Date.now();
            script.onload = () => {
                setTimeout(() => {
                    displayResults();
                }, 1000);
            };
            document.head.appendChild(script);
        }
        
        function displayResults() {
            const resultsDiv = document.getElementById('results');
            const testResults = window.KickALLAPITest;
            
            if (!testResults) {
                resultsDiv.innerHTML = '<p>❌ Test results not available. Make sure config.js is loaded.</p>';
                return;
            }
            
            let html = `
                <div class="summary ${testResults.failed === 0 ? 'pass' : 'fail'}">
                    📊 Summary: ${testResults.passed}/${testResults.results.length} tests passed
                </div>
            `;
            
            testResults.results.forEach((result, index) => {
                html += `
                    <div class="test-result ${result.success ? 'pass' : 'fail'}">
                        <strong>${index + 1}. ${result.name}</strong><br>
                        Status: ${result.success ? '✅ PASS' : '❌ FAIL'}<br>
                        URL: ${result.url}<br>
                        ${result.status ? `HTTP Status: ${result.status} ${result.statusText}<br>` : ''}
                        ${result.error ? `Error: ${result.error}<br>` : ''}
                        ${result.data ? `<pre>${JSON.stringify(result.data, null, 2)}</pre>` : ''}
                    </div>
                `;
            });
            
            resultsDiv.innerHTML = html;
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        // Auto-run tests if config is loaded
        if (window.CONFIG) {
            setTimeout(runTests, 500);
        } else {
            document.getElementById('results').innerHTML = '<p>⚠️ Config not loaded. Click "Run Tests" manually.</p>';
        }
    </script>
</body>
</html>
