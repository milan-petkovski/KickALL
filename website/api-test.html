<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KickALL">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="theme-color" content="#06040A">
    <meta name="color-scheme" content="dark">
    <title>KickALL API Test Suite</title>
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/assets/logo.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #06040A;
            color: #ffffff;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 60%, #53FC18 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.1rem;
        }

        .featured-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .test-card.featured {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2) 0%, rgba(83, 252, 24, 0.1) 100%);
            border: 2px solid rgba(139, 92, 246, 0.5);
            padding: 32px;
            transform: scale(1.02);
            overflow: hidden;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        .test-card.featured:hover {
            transform: scale(1.05);
            border-color: rgba(83, 252, 24, 0.6);
        }

        .test-card.featured .test-icon {
            width: 48px;
            height: 48px;
            background: rgba(139, 92, 246, 0.3);
        }

        .test-card.featured .test-icon svg {
            width: 24px;
            height: 24px;
        }

        .test-card.featured .test-name {
            font-size: 1.1rem;
            font-weight: 700;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        .test-card.featured .test-endpoint {
            font-size: 0.8rem;
            word-break: break-all;
            overflow-wrap: break-word;
        }

        .featured-badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(83, 252, 24, 0.2);
            color: #53FC18;
            border: 1px solid rgba(83, 252, 24, 0.3);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .test-card {
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
            overflow: hidden;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        .test-card:hover {
            background: rgba(139, 92, 246, 0.15);
            border-color: rgba(139, 92, 246, 0.5);
            transform: translateY(-2px);
        }

        .test-card.success {
            border-color: rgba(83, 252, 24, 0.5);
            background: rgba(83, 252, 24, 0.1);
        }

        .test-card.error {
            border-color: rgba(239, 68, 68, 0.5);
            background: rgba(239, 68, 68, 0.1);
        }

        .test-card.loading {
            border-color: rgba(251, 191, 36, 0.5);
            background: rgba(251, 191, 36, 0.1);
        }

        .test-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .test-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(139, 92, 246, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .test-icon svg {
            width: 18px;
            height: 18px;
            color: #8B5CF6;
        }

        .test-info {
            flex: 1;
            min-width: 0;
            max-width: 100%;
            overflow: hidden;
        }

        .test-name {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 4px;
            word-break: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
        }

        .test-endpoint {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Courier New', monospace;
            word-break: break-all;
            overflow-wrap: break-word;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .test-status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .status-badge.pending {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
        }

        .status-badge.loading {
            background: rgba(251, 191, 36, 0.2);
            color: #FBBF24;
        }

        .status-badge.success {
            background: rgba(83, 252, 24, 0.2);
            color: #53FC18;
        }

        .status-badge.error {
            background: rgba(239, 68, 68, 0.2);
            color: #EF4444;
        }

        .test-details {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 12px;
            font-size: 0.85rem;
            max-height: 200px;
            overflow-y: auto;
            overflow-x: hidden;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        .test-details pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
            color: rgba(255, 255, 255, 0.8);
        }

        .test-details pre code {
            display: block;
            max-width: 100%;
            overflow-x: hidden;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #8B5CF6;
            color: white;
        }

        .btn-primary:hover {
            background: #7C3AED;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn svg {
            width: 16px;
            height: 16px;
        }

        .summary {
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
        }

        .summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .summary-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
        }

        .stat {
            text-align: center;
            padding: 16px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stat-value.success {
            color: #53FC18;
        }

        .stat-value.error {
            color: #EF4444;
        }

        .stat-label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
        }

        .loading-spinner {
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 20px 16px;
            }

            .header h1 {
                font-size: 1.75rem;
            }

            .featured-section {
                grid-template-columns: 1fr;
            }

            .test-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .section-title {
                font-size: 1.25rem;
            }
        }

        /* Custom Scrollbar */
        * {
            scrollbar-width: thin;
            scrollbar-color: #7C3AED transparent;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #7C3AED, #53FC18);
            border-radius: 20px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #53FC18;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 KickALL API Test Suite</h1>
            <p>Test Kick API connectivity, CORS proxies, and backend endpoints</p>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="runAllTests()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                Run All Tests
            </button>
            <button class="btn btn-secondary" onclick="clearResults()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
                Clear Results
            </button>
        </div>

        <div class="summary" id="summary" style="display: none;">
            <div class="summary-header">
                <div class="summary-title">Test Summary</div>
                <div class="status-badge" id="overallStatus">Pending</div>
            </div>
            <div class="summary-stats">
                <div class="stat">
                    <div class="stat-value" id="totalTests">0</div>
                    <div class="stat-label">Total</div>
                </div>
                <div class="stat">
                    <div class="stat-value success" id="passedTests">0</div>
                    <div class="stat-label">Passed</div>
                </div>
                <div class="stat">
                    <div class="stat-value error" id="failedTests">0</div>
                    <div class="stat-label">Failed</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="duration">0ms</div>
                    <div class="stat-label">Duration</div>
                </div>
            </div>
        </div>

        <div class="section-title" style="margin-bottom: 20px; font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; font-weight: 600; color: rgba(255, 255, 255, 0.8);">
            ⭐ Featured API Tests
        </div>
        
        <div class="featured-section" id="testGrid">
            <!-- Featured test cards will be dynamically generated -->
        </div>
        
        <div class="section-title" style="margin-bottom: 20px; font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; font-weight: 600; color: rgba(255, 255, 255, 0.8);">
            📋 Other API Endpoints
        </div>
        
        <div class="test-grid" id="secondaryGrid">
            <!-- Secondary test cards will be dynamically generated -->
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api-test.js"></script>
</body>
</html>
