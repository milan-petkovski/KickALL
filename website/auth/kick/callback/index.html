<!DOCTYPE html>
<html lang="sr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <title>KickALL | OAuth Autorizacija</title>
  <link rel="icon" href="../../../assets/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="/assets/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght=600;700&display=swap" rel="stylesheet">
  
  <!-- Configuration -->
  <script src="/js/config.js"></script>
  
  <!-- Fallback for subdirectory structure -->
  <script>
    if (!window.CONFIG) {
      // Try to load config from parent directory if not loaded
      const script = document.createElement('script');
      script.src = '../js/config.js';
      document.head.appendChild(script);
    }
  </script>
  
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #06040A;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      overflow: hidden;
    }

    .glow-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.18;
      animation: blobFloat 8s ease-in-out infinite alternate;
    }

    .blob-violet {
      width: 480px;
      height: 480px;
      background: #7C3AED;
      top: -120px;
      left: -120px;
    }

    .blob-green {
      width: 420px;
      height: 420px;
      background: #53FC18;
      bottom: -100px;
      right: -100px;
      animation-delay: -4s;
    }

    @keyframes blobFloat {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 20px) scale(1.05); }
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      backdrop-filter: blur(24px);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
    }

    .logo-wrap {
      margin-bottom: 28px;
    }

    .logo-wrap img {
      height: 52px;
      width: auto;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ffffff;
    }

    p {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.55);
      line-height: 1.5;
    }

    .status-icon {
      margin-bottom: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .status-msg {
      font-size: 1.05rem;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 8px;
    }

    .status-sub {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.45);
    }

    .error-message {
      color: #EF4444;
      font-size: 0.9rem;
      margin-top: 16px;
      text-align: center;
      max-width: 300px;
      line-height: 1.4;
    }

    .btn-retry {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 28px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-retry:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>

<body>
  <div class="card" id="errorCard" style="display: none;">
    <div class="logo-wrap">
      <img src="../../../assets/kickall.webp" alt="Kickall Logo" class="logo-img" style="height: 52px; width: auto;" loading="lazy">
    </div>
    <div class="status-icon">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>
    <h1>Greška prilikom autorizacije</h1>
    <p class="status-msg" id="errorStatus">Došlo je do greške</p>
    <p class="status-sub" id="errorDetails">Molimo vas pokušajte ponovo</p>
    <a href="../../../index.html" class="btn-retry">Nazad na početnu</a>
  </div>

  <script>
    const userLang = (localStorage.getItem('kickall_lang') || 'sr') === 'en' ? 'en' : 'sr';
    const translations = {
      sr: {
        title: 'Greška prilikom autorizacije',
        btnRetry: 'Nazad na početnu',
        defaultStatus: 'Došlo je do greške',
        defaultDetails: 'Molimo vas pokušajte ponovo',
        oauthCancel: 'Autorizacija je otkazana. Molimo vas pokušajte ponovo.',
        tokenMismatch: 'Token mismatch. Molimo vas započnite proces autorizacije ponovo.',
        missingCode: 'Authorization code nedostaje. Molimo vas pokušajte ponovo.',
        missingVerifier: 'Verifikacioni kod nedostaje. Molimo vas započnite proces autorizacije ponovo.',
        serverWaking: 'Backend server se budi. Molim vas sačekajte 15-30 sekundi i pokušajte ponovo.',
        exchangeFailed: 'Greška prilikom razmene tokena. Molimo vas pokušajte ponovo.',
        missingToken: 'Nedostaje access token u odgovoru. Molimo vas pokušajte ponovo.',
        connError: 'Greška u povezivanju sa serverom. Molimo vas pokušajte ponovo.'
      },
      en: {
        title: 'Authorization Error',
        btnRetry: 'Back to Home',
        defaultStatus: 'An error occurred',
        defaultDetails: 'Please try again',
        oauthCancel: 'Authorization was canceled. Please try again.',
        tokenMismatch: 'Token mismatch. Please restart authorization.',
        missingCode: 'Authorization code is missing. Please try again.',
        missingVerifier: 'Verification code is missing. Please restart authorization.',
        serverWaking: 'Backend server is waking up. Please wait 15-30 seconds and try again.',
        exchangeFailed: 'Token exchange failed. Please try again.',
        missingToken: 'Access token missing in response. Please try again.',
        connError: 'Server connection error. Please try again.'
      }
    };
    const t = translations[userLang];

    function showErrorToUser(statusMessage, detailsMessage) {
      const errorCard = document.getElementById('errorCard');
      const errorStatus = document.getElementById('errorStatus');
      const errorDetails = document.getElementById('errorDetails');
      const cardTitle = errorCard ? errorCard.querySelector('h1') : null;
      const btnRetry = errorCard ? errorCard.querySelector('.btn-retry') : null;
      
      if (cardTitle) cardTitle.textContent = t.title;
      if (btnRetry) btnRetry.textContent = t.btnRetry;
      if (errorCard) errorCard.style.display = 'block';
      if (errorStatus) errorStatus.textContent = statusMessage || t.defaultStatus;
      if (errorDetails) errorDetails.textContent = detailsMessage || t.defaultDetails;
    }

    (async function processKickOAuth() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');

      if (error) {
        showErrorToUser('OAuth Error', t.oauthCancel);
        return;
      }

      const savedState = sessionStorage.getItem('kick_oauth_state') || localStorage.getItem('kick_oauth_state');
      
      // Skip state validation for localhost to avoid development issues
      const isLocalhost = window.location.hostname === 'localhost' || 
                          window.location.hostname === '127.0.0.1' ||
                          window.location.hostname === '0.0.0.0';
      
      if (!isLocalhost && (!state || state !== savedState)) {
        console.error('State mismatch - Expected:', savedState, 'Got:', state);
        showErrorToUser('Security Error', t.tokenMismatch);
        return;
      }

      if (!code) {
        showErrorToUser('Missing Code', t.missingCode);
        return;
      }

      // Use CONFIG storage keys if available
      const codeVerifierKey = window.CONFIG && window.CONFIG.STORAGE_KEYS 
        ? window.CONFIG.STORAGE_KEYS.KICK_CODE_VERIFIER 
        : 'kick_code_verifier';
      const codeVerifier = sessionStorage.getItem(codeVerifierKey) || localStorage.getItem(codeVerifierKey) || '';
      
      if (!codeVerifier) {
        console.error('Code verifier missing from storage');
        showErrorToUser('Session Error', t.missingVerifier);
        return;
      }
      
      // Use dynamic redirect URI based on current origin
      const redirectUri = `${window.location.origin}/auth/kick/callback/`;

      const apiBase = window.CONFIG && window.CONFIG.getBackendApiBase 
        ? window.CONFIG.getBackendApiBase()
        : (window.location.hostname.endsWith('netlify.app')
          ? 'https://kickbot-ihzb.onrender.com'
          : (window.KICK_API_BASE || window.location.origin).replace(/\/+$/, ''));

      try {
        console.log('Attempting token exchange:', { apiBase, codeVerifier: codeVerifier ? 'present' : 'missing', redirectUri });
        
        // Simple single attempt with better error handling
        const response = await Promise.race([
          fetch(`${apiBase}/api/kick/exchange`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ code, code_verifier: codeVerifier, redirect_uri: redirectUri }).toString()
          }),
          new Promise((_, reject) => setTimeout(() => reject(new Error('Exchange timeout')), 25000))
        ]);
        
        console.log('Exchange response status:', response.status);
        
        if (!response.ok) {
          const errorText = await response.text();
          console.error('Exchange failed:', errorText);
          
          // Show error to user immediately for 502 errors
          if (response.status === 502) {
            showErrorToUser('Server Unavailable', t.serverWaking);
            
            // Auto-redirect after longer delay to allow for server wake-up
            setTimeout(() => {
              window.location.href = `/index.html`;
            }, 15000);
          } else {
            showErrorToUser('Token Exchange Failed', t.exchangeFailed);
          }
          return;
        }

        const tokenData = await response.json();
        console.log('Token response:', tokenData);
        
        if (!tokenData.access_token) {
          console.error('No access token in response:', tokenData);
          showErrorToUser('Invalid Token Response', t.missingToken);
          return;
        }

        sessionStorage.setItem('kick_access_token', tokenData.access_token);
        localStorage.setItem('kick_access_token', tokenData.access_token);
        localStorage.setItem('kick_token_type', tokenData.token_type || 'Bearer');
        localStorage.setItem('kick_session_active', 'true');
        sessionStorage.setItem('kick_oauth_code', code);

        ['kick_oauth_state', 'kick_code_verifier'].forEach(key => {
          sessionStorage.removeItem(key);
          localStorage.removeItem(key);
        });

        const originSite = sessionStorage.getItem('kick_origin_site') ||
          localStorage.getItem('kick_origin_site') ||
          (sessionStorage.getItem('from_kickall') === 'true' ? 'kickall' : 'kickot');

        const targets = {
          kickot: 'kickot/dashboard.html',
          kickaj: 'kickaj/dashboard.html',
          kickan: 'kickan/dashboard.html',
          kickov: 'kickov/dashboard.html'
        };

        const targetPage = targets[originSite] || 'dashboard.html';

        // Use absolute path from root to avoid path concatenation issues
        window.location.replace(`/${targetPage}?kick_oauth=1`);

      } catch (err) {
        console.error('OAuth callback error:', err);
        showErrorToUser('Connection Error', t.connError);
      }
    })();
  </script>
</body>

</html>
