<!DOCTYPE html>
<html lang="sr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <title>KickALL | OAuth Autorizacija</title>
  <link rel="icon" href="../../assets/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="/assets/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght=600;700&display=swap" rel="stylesheet">
  
  <!-- Configuration -->
  <script src="/js/config.js"></script>
  
  <!-- Fallback for subdirectory structure -->
  <script>
    if (!window.CONFIG) {
      // Try to load config from parent directory if not loaded
      const script = document.createElement('script');
      script.src = '../js/config.js';
      document.head.appendChild(script);
    }
  </script>
  
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #06040A;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      overflow: hidden;
    }

    .glow-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.18;
      animation: blobFloat 8s ease-in-out infinite alternate;
    }

    .blob-violet {
      width: 480px;
      height: 480px;
      background: #7C3AED;
      top: -120px;
      left: -120px;
    }

    .blob-green {
      width: 420px;
      height: 420px;
      background: #53FC18;
      bottom: -100px;
      right: -100px;
      animation-delay: -4s;
    }

    @keyframes blobFloat {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 20px) scale(1.05); }
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      backdrop-filter: blur(24px);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
    }

    .logo-wrap {
      margin-bottom: 28px;
    }

    .logo-wrap img {
      height: 52px;
      width: auto;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(83, 252, 24, 0.15);
      border-top-color: #53FC18;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ffffff;
    }

    p {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.55);
      line-height: 1.5;
    }

    .status-icon {
      margin-bottom: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .status-msg {
      font-size: 1.05rem;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 8px;
    }

    .status-sub {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.45);
    }

    .error-message {
      color: #EF4444;
      font-size: 0.9rem;
      margin-top: 16px;
      text-align: center;
      max-width: 300px;
      line-height: 1.4;
    }

    .btn-retry {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 28px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-retry:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="assets/kickot.webp" alt="Kickot Logo" class="logo-img" style="height: 52px; width: auto;" loading="lazy">
    </div>
    <div class="spinner" id="loadingSpinner"></div>
    <h1 id="loadingTitle">Obrada...</h1>
    <p id="loadingMessage">Autorizacija je u toku</p>
    <div class="error-message" id="errorMessage" style="display: none;"></div>
  </div>

  <script>
    function showErrorToUser(message) {
      const spinner = document.getElementById('loadingSpinner');
      const title = document.getElementById('loadingTitle');
      const msg = document.getElementById('loadingMessage');
      const errorDiv = document.getElementById('errorMessage');
      
      if (spinner) spinner.style.display = 'none';
      if (title) title.textContent = 'Greška';
      if (msg) msg.style.display = 'none';
      if (errorDiv) {
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
      }
    }

    (async function processKickOAuth() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');

      if (error) {
        // Redirect to appropriate index based on current path
        const currentPath = window.location.pathname;
        const basePath = currentPath.includes('/auth/') ? '/' : '../';
        window.location.href = `${basePath}index.html?error=` + encodeURIComponent(error);
        return;
      }

      const savedState = sessionStorage.getItem('kick_oauth_state') || localStorage.getItem('kick_oauth_state');
      
      // Skip state validation for localhost to avoid development issues
      const isLocalhost = window.location.hostname === 'localhost' || 
                          window.location.hostname === '127.0.0.1' ||
                          window.location.hostname === '0.0.0.0';
      
      if (!isLocalhost && (!state || state !== savedState)) {
        console.error('State mismatch - Expected:', savedState, 'Got:', state);
        const currentPath = window.location.pathname;
        const basePath = currentPath.includes('/auth/') ? '/' : '../';
        window.location.href = `${basePath}index.html?error=state_mismatch`;
        return;
      }

      if (!code) {
        const currentPath = window.location.pathname;
        const basePath = currentPath.includes('/auth/') ? '/' : '../';
        window.location.href = `${basePath}index.html?error=no_code`;
        return;
      }

      // Use CONFIG storage keys if available
      const codeVerifierKey = window.CONFIG && window.CONFIG.STORAGE_KEYS 
        ? window.CONFIG.STORAGE_KEYS.KICK_CODE_VERIFIER 
        : 'kick_code_verifier';
      const codeVerifier = sessionStorage.getItem(codeVerifierKey) || localStorage.getItem(codeVerifierKey) || '';
      
      if (!codeVerifier) {
        console.error('Code verifier missing from storage');
        // Redirect to appropriate index based on current path
        const currentPath = window.location.pathname;
        const basePath = currentPath.includes('/auth/') ? '/' : '../';
        window.location.href = `${basePath}index.html?error=no_verifier`;
        return;
      }
      
      // Use dynamic redirect URI based on current origin
      const redirectUri = `${window.location.origin}/auth/kick/callback/`;

      const apiBase = window.CONFIG && window.CONFIG.getBackendApiBase 
        ? window.CONFIG.getBackendApiBase()
        : (window.location.hostname.endsWith('netlify.app')
          ? 'https://kickbot-ihzb.onrender.com'
          : (window.KICK_API_BASE || window.location.origin).replace(/\/+$/, ''));

      try {
        console.log('Attempting token exchange:', { apiBase, codeVerifier: codeVerifier ? 'present' : 'missing', redirectUri });
        
        // Simple single attempt with better error handling
        const response = await Promise.race([
          fetch(`${apiBase}/api/kick/exchange`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ code, code_verifier: codeVerifier, redirect_uri: redirectUri }).toString()
          }),
          new Promise((_, reject) => setTimeout(() => reject(new Error('Exchange timeout')), 25000))
        ]);
        
        console.log('Exchange response status:', response.status);
        
        if (!response.ok) {
          const errorText = await response.text();
          console.error('Exchange failed:', errorText);
          
          // Show error to user immediately for 502 errors
          if (response.status === 502) {
            showErrorToUser('Backend server se budi (Render cold start). Molim vas sačekajte 15-30 sekundi i pokušajte ponovo.');
            
            // Auto-redirect after longer delay to allow for server wake-up
            setTimeout(() => {
              const currentPath = window.location.pathname;
              const basePath = currentPath.includes('/auth/') ? '/' : '../';
              window.location.href = `${basePath}index.html?error=server_unavailable`;
            }, 15000);
          } else {
            const currentPath = window.location.pathname;
            const basePath = currentPath.includes('/auth/') ? '/' : '../';
            window.location.href = `${basePath}index.html?error=exchange_failed&details=` + encodeURIComponent(errorText);
          }
          return;
        }

        const tokenData = await response.json();
        console.log('Token response:', tokenData);
        
        if (!tokenData.access_token) {
          console.error('No access token in response:', tokenData);
          const currentPath = window.location.pathname;
          const basePath = currentPath.includes('/auth/') ? '/' : '../';
          window.location.href = `${basePath}index.html?error=no_token&details=` + encodeURIComponent(JSON.stringify(tokenData));
          return;
        }

        sessionStorage.setItem('kick_access_token', tokenData.access_token);
        localStorage.setItem('kick_access_token', tokenData.access_token);
        localStorage.setItem('kick_token_type', tokenData.token_type || 'Bearer');
        localStorage.setItem('kick_session_active', 'true');
        sessionStorage.setItem('kick_oauth_code', code);

        ['kick_oauth_state', 'kick_code_verifier'].forEach(key => {
          sessionStorage.removeItem(key);
          localStorage.removeItem(key);
        });

        const originSite = sessionStorage.getItem('kick_origin_site') ||
          localStorage.getItem('kick_origin_site') ||
          (sessionStorage.getItem('from_kickall') === 'true' ? 'kickall' : 'kickot');

        const targets = {
          kickot: 'kickot/dashboard.html',
          kickaj: 'kickaj/dashboard.html',
          kickan: 'kickan/dashboard.html',
          kickov: 'kickov/dashboard.html'
        };

        const targetPage = targets[originSite] || 'dashboard.html';

        // Use relative path for production compatibility
        window.location.replace(`${targetPage}?kick_oauth=1`);

      } catch (err) {
        const currentPath = window.location.pathname;
        const basePath = currentPath.includes('/auth/') ? '/' : '../';
        window.location.href = `${basePath}index.html?error=connection_error`;
      }
    })();
  </script>
</body>

</html>
