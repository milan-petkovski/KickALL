<!DOCTYPE html>
<html lang="sr">

<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const error = params.get('error');

      if (code || error) {
        const originSite = sessionStorage.getItem('kick_origin_site') ||
          localStorage.getItem('kick_origin_site') ||
          (sessionStorage.getItem('from_kickall') === 'true' ? 'kickall' : 'kickot');

        let targetPage = 'dashboard.html';
        if (originSite === 'kickot') targetPage = 'kickot/dashboard.html';
        else if (originSite === 'kickaj') targetPage = 'kickaj/dashboard.html';
        else if (originSite === 'kickan') targetPage = 'kickan/dashboard.html';
        else if (originSite === 'kickov') targetPage = 'kickov/dashboard.html';

        window.location.replace(`/${targetPage}` + window.location.search);
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KickALL | OAuth Autorizacija</title>
  <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #06040A;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      overflow: hidden;
    }

    .glow-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.18;
      animation: blobFloat 8s ease-in-out infinite alternate;
    }

    .blob-violet {
      width: 480px;
      height: 480px;
      background: #7C3AED;
      top: -120px;
      left: -120px;
    }

    .blob-green {
      width: 420px;
      height: 420px;
      background: #53FC18;
      bottom: -100px;
      right: -100px;
      animation-delay: -4s;
    }

    @keyframes blobFloat {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 20px) scale(1.05); }
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      backdrop-filter: blur(24px);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
    }

    .logo-wrap {
      margin-bottom: 28px;
    }

    .logo-wrap img {
      height: 52px;
      width: auto;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(83, 252, 24, 0.15);
      border-top-color: #53FC18;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ffffff;
    }

    p {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.55);
      line-height: 1.5;
    }

    .status-icon {
      margin-bottom: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .status-msg {
      font-size: 1.05rem;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 8px;
    }

    .status-sub {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.45);
    }

    .btn-retry {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 28px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-retry:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>

<body>
  <div class="glow-bg">
    <div class="blob blob-violet"></div>
    <div class="blob blob-green"></div>
  </div>

  <div class="card" id="card">
    <div class="logo-wrap">
      <img src="/assets/kickall.png" alt="KickALL Logo" onerror="this.style.display='none'">
    </div>

    <div id="loadingState">
      <div class="spinner"></div>
      <h1>Autorizacija u toku...</h1>
      <p>Molimo sačekaj dok obradimo prijavu.</p>
    </div>

    <div id="errorState" style="display:none;">
      <div class="status-icon" style="color: #EF4444;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="15" y1="9" x2="9" y2="15"/>
          <line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
      </div>
      <h1 class="status-msg" id="errorTitle">Greška pri autorizaciji</h1>
      <p class="status-sub" id="errorDetail">Pokušaj ponovo.</p>
      <a href="/index.html" class="btn-retry">Pokušaj ponovo</a>
    </div>

    <div id="successState" style="display:none;">
      <div class="status-icon" style="color: #53FC18;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
      </div>
      <h1 class="status-msg">Uspešna prijava!</h1>
      <p class="status-sub">Preusmeravanje na dashboard...</p>
    </div>
  </div>

  <script>
    (async function processKickOAuth() {
      const isLocalhost = ['localhost', '127.0.0.1'].includes(window.location.hostname);
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');

      const UI = {
        loading: document.getElementById('loadingState'),
        error: document.getElementById('errorState'),
        success: document.getElementById('successState'),
        errorTitle: document.getElementById('errorTitle'),
        errorDetail: document.getElementById('errorDetail')
      };

      function showError(title, detail) {
        UI.loading.style.display = 'none';
        UI.success.style.display = 'none';
        UI.error.style.display = 'block';
        UI.errorTitle.textContent = title || 'Greška pri autorizaciji';
        UI.errorDetail.textContent = detail || 'Došlo je do neočekivane greške. Pokušaj ponovo.';
      }

      if (error) {
        showError('Kick je odbio autorizaciju', `Razlog: ${error}`);
        return;
      }

      const savedState = sessionStorage.getItem('kick_oauth_state') || localStorage.getItem('kick_oauth_state');
      if (!isLocalhost && (!state || state !== savedState)) {
        showError('Bezbednosna provera neuspešna', 'State parametar se ne podudara.');
        return;
      }

      if (!code) {
        showError('Nedostaje autorizacioni kod', 'Kick nije poslao kod za autentifikaciju.');
        return;
      }

      const codeVerifier = sessionStorage.getItem('kick_code_verifier') || localStorage.getItem('kick_code_verifier') || '';
      const redirectUri = `${window.location.origin}/auth/kick/callback/`;

      const apiBase = isLocalhost || window.location.hostname.endsWith('netlify.app')
        ? 'https://kickbot-ihzb.onrender.com'
        : (window.KICK_API_BASE || window.location.origin).replace(/\/+$/, '');

      try {
        const response = await fetch(`${apiBase}/api/kick/exchange`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ code, code_verifier: codeVerifier, redirect_uri: redirectUri }).toString()
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({ error: 'Greška na serveru' }));
          showError('Razmena tokena nije uspela', errData.detail || errData.error || 'Server nije dostupan.');
          return;
        }

        const tokenData = await response.json();
        if (!tokenData.access_token) {
          showError('Token nije dobijen', 'Kick server nije vratio pristupni token.');
          return;
        }

        sessionStorage.setItem('kick_access_token', tokenData.access_token);
        localStorage.setItem('kick_access_token', tokenData.access_token);
        localStorage.setItem('kick_token_type', tokenData.token_type || 'Bearer');
        localStorage.setItem('kick_session_active', 'true');

        ['kick_oauth_state', 'kick_code_verifier'].forEach(key => {
          sessionStorage.removeItem(key);
          localStorage.removeItem(key);
        });

        UI.loading.style.display = 'none';
        UI.success.style.display = 'block';

        const originSite = sessionStorage.getItem('kick_origin_site') ||
          localStorage.getItem('kick_origin_site') ||
          (sessionStorage.getItem('from_kickall') === 'true' ? 'kickall' : 'kickot');

        const targets = {
          kickot: 'kickot/dashboard.html',
          kickaj: 'kickaj/dashboard.html',
          kickan: 'kickan/dashboard.html',
          kickov: 'kickov/dashboard.html'
        };

        const targetPage = targets[originSite] || 'dashboard.html';

        setTimeout(() => {
          window.location.replace(`/${targetPage}?kick_oauth=1`);
        }, 500);

      } catch (err) {
        showError('Greška pri konekciji', 'Nije moguće kontaktirati API server: ' + err.message);
      }
    })();
  </script>
</body>

</html>
