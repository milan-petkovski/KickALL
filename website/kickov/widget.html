<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KICKOV - OBS Browser Source Widget</title>
  <link rel="shortcut icon" href="../assets/favicon.ico" type="image/x-icon">
  <style>
    html, body {
      background: transparent !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Space Grotesk', 'Inter', sans-serif;
    }
    #obsAlertContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
  </style>

  <!-- External Styles & Animations -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/kickov.css" />

  <!-- Supabase JS CDN & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/dist/config.min.js"></script>
</head>
<body>

  <!-- Transparent OBS Overlay Stage Container -->
  <div id="obsAlertContainer"></div>

  <!-- Realtime OBS Queue Manager Script -->
  <script src="js/kickov-widget.js" defer></script>
</body>
</html>
