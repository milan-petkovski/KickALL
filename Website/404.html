<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#06040A">
    <meta name="color-scheme" content="dark">
    <meta name="robots" content="noindex, follow">

    <title>404 - Stranica nije pronađena | KickALL</title>
    <meta name="description" content="Tražena stranica na KickALL platformi ne postoji ili je premeštena.">
    <link rel="shortcut icon" href="/assets/favicon.ico" type="image/x-icon">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css?v=20260915-v2">
    <link rel="stylesheet" href="css/landing-premium.css?v=20260917-v1">

    <style>
        :root {
            --bg-dark: #06040A;
            --grad-card-dark: linear-gradient(180deg, rgba(18, 13, 34, 0.94) 0%, rgba(10, 7, 20, 0.98) 100%);
            --border-card: rgba(139, 92, 246, 0.28);
            --text-primary: #FFFFFF;
            --text-secondary: #94A3B8;
            --kick-green: #53FC18;
            --kick-green-glow: rgba(83, 252, 24, 0.35);
            --accent-purple: #8B5CF6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        .error-container {
            position: relative;
            z-index: 1;
            max-width: 620px;
            width: 100%;
            background: var(--grad-card-dark);
            border: 1px solid var(--border-card);
            border-radius: 26px;
            padding: 48px 36px;
            text-align: center;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 35px rgba(83, 252, 24, 0.12);
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 28px;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .brand-logo:hover {
            transform: scale(1.05);
        }

        .brand-logo img {
            height: 42px;
            width: auto;
            display: block;
        }

        .error-code {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(4.8rem, 13vw, 7rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -3px;
            background: linear-gradient(135deg, #FFFFFF 20%, #53FC18 60%, #8B5CF6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 14px;
            filter: drop-shadow(0 0 25px rgba(83, 252, 24, 0.35));
        }

        .error-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(1.4rem, 4vw, 1.85rem);
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
        }

        .error-desc {
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.65;
            margin-bottom: 34px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        .actions-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            justify-content: center;
            align-items: center;
        }

        @media (min-width: 480px) {
            .actions-group {
                flex-direction: row;
            }
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 48px;
            padding: 13px 26px;
            border-radius: 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            width: 100%;
        }

        @media (min-width: 480px) {
            .btn {
                width: auto;
            }
        }

        .btn-primary {
            background: linear-gradient(135deg, #53FC18 0%, #3FBA0E 100%);
            color: #06040A;
            border: 1px solid #53FC18;
            box-shadow: 0 0 20px rgba(83, 252, 24, 0.4);
        }

        .btn-primary:hover,
        .btn-primary:focus-visible {
            background: #6EFF35;
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(83, 252, 24, 0.6);
        }

        .btn-secondary {
            background: rgba(18, 13, 34, 0.8);
            color: #FFFFFF;
            border: 1px solid rgba(139, 92, 246, 0.35);
        }

        .btn-secondary:hover,
        .btn-secondary:focus-visible {
            background: rgba(139, 92, 246, 0.15);
            border-color: rgba(139, 92, 246, 0.6);
            transform: translateY(-2px);
        }

        .quick-links {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(139, 92, 246, 0.16);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            font-size: 0.88rem;
        }

        .quick-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 14px;
            background: rgba(6, 4, 10, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
        }

        .quick-links a:hover,
        .quick-links a:focus-visible {
            color: var(--kick-green);
            background: rgba(83, 252, 24, 0.1);
            border-color: rgba(83, 252, 24, 0.35);
            transform: translateY(-1px);
        }

        .icon {
            width: 18px;
            height: 18px;
            stroke-width: 2;
            flex-shrink: 0;
        }
    </style>
</head>

<body>
    <a href="#main-content" class="skip-link sr-only">Pređi na glavni sadržaj</a>

    <!-- Ambient Glow Layer -->
    <div class="glow-bg" aria-hidden="true">
        <div class="blob blob-violet"></div>
        <div class="blob blob-green"></div>
        <div class="blob blob-cyan"></div>
    </div>

    <main id="main-content" class="error-container">
        <a href="/" class="brand-logo" aria-label="KickALL Početna">
            <img src="assets/kickall.webp" alt="KickALL Logo" width="160" height="48" loading="eager" fetchpriority="high">
        </a>

        <div class="error-code" aria-hidden="true">404</div>
        <h1 class="error-title">Stranica nije pronađena</h1>
        <p class="error-desc">
            Link koji ste pratili je možda neispravan, stranica je uklonjena ili je došlo do greške u adresi.
        </p>

        <div class="actions-group">
            <a href="/" class="btn btn-primary">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>Početna stranica</span>
            </a>
            <a href="/dashboard.html" class="btn btn-secondary">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="7" height="9" x="3" y="3" rx="1"></rect>
                    <rect width="7" height="5" x="14" y="3" rx="1"></rect>
                    <rect width="7" height="9" x="14" y="12" rx="1"></rect>
                    <rect width="7" height="5" x="3" y="16" rx="1"></rect>
                </svg>
                <span>Korisnički Dashboard</span>
            </a>
        </div>

        <nav class="quick-links" aria-label="Brzi linkovi">
            <a href="/kickot/dashboard.html">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 8V4H8"></path>
                    <rect width="16" height="12" x="4" y="8" rx="2"></rect>
                    <path d="M2 14h2"></path>
                    <path d="M20 14h2"></path>
                    <path d="M15 13v2"></path>
                    <path d="M9 13v2"></path>
                </svg>
                <span>Kickot Bot</span>
            </a>
            <a href="/kickaj/dashboard.html">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="m4.93 4.93 4.24 4.24"></path>
                    <path d="m14.83 9.17 4.24-4.24"></path>
                    <path d="m14.83 14.83 4.24 4.24"></path>
                    <path d="m9.17 14.83-4.24 4.24"></path>
                    <circle cx="12" cy="12" r="4"></circle>
                </svg>
                <span>Kickaj Točak</span>
            </a>
            <a href="/pricing.html">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"></path>
                    <path d="M12 18V6"></path>
                </svg>
                <span>Cenovnik</span>
            </a>
        </nav>
    </main>
</body>

</html>
