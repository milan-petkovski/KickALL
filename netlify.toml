  to = "/kickot/dashboard.html"
  status = 200
  force = true

[[redirects]]
  from = "/kickaj"
  to = "/kickaj/dashboard.html"
  status = 200
  force = true

[[redirects]]
  from = "/kickan"
  to = "/kickan/dashboard.html"
  status = 200
  force = true

[[redirects]]
  from = "/kickov"
  to = "/kickov/dashboard.html"
  status = 200
  force = true

[[redirects]]
  from = "/kickot/*"
  to = "/kickot/dashboard.html"
  status = 200
  force = false

[[redirects]]
  from = "/kickaj/*"
  to = "/kickaj/dashboard.html"
  status = 200
