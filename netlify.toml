# Specifične rute za pod-aplikacije (MORA IĆI PRE /*)
[[redirects]]
  from = "/kickot/*"
  to = "/kickot/index.html"
  status = 200
  force = false

# Catch-all za glavnu aplikaciju (MORA IĆI NA SAMOM DNU)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false